# Administrácia kostolov – Synology NAS (Container Manager → Projekt)
services:
  tvdisplay-admin:
    build: .
    container_name: tvdisplay-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Prvý administrátor – použije sa iba pri prvom spustení (keď ešte nie sú žiadni používatelia).
      # Po prihlásení si heslo zmeň v administrácii (ikona 🔑).
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: zmen-toto-heslo
      # Kostoly sú podpriečinky zdieľaného priečinka tvdisplay – ten istý, ktorý Orange Pi čítajú cez WebDAV
      ADMIN_CHURCHES_DIR: /churches
      ADMIN_SHARE_NAME: tvdisplay
    volumes:
      # Používatelia a prihlásenia – tento priečinok zálohuj
      - ./admin-data:/data
      # Zdieľaný priečinok s piesňami, obrázkami a prezentáciami kostolov (cesta na NAS podľa File Station → Vlastnosti)
      - /volume1/tvdisplay:/churches
